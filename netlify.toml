# Static hosting config for the portfolio.
# The site needs no build step. The dashboard also works on static hosting:
# enable "GitHub publishing" inside /admin.html to save straight into the repo.
[build]
  publish = "."
  command = "echo 'Static site - no build required'"

# Backup files and the local server are never part of the public site.
[[redirects]]
  from = "/content/backups/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/server.js"
  to = "/"
  status = 302

[[headers]]
  for = "/content/site.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
