# Static hosting config for the portfolio.
# The site itself needs no build step; the dashboard API only runs locally
# with `node server.js`, so the admin route is hidden on public deploys.
[build]
  publish = "."
  command = "echo 'Static site - no build required'"

[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/admin"
  to = "/"
  status = 302

[[redirects]]
  from = "/content/backups/*"
  to = "/"
  status = 302

[[headers]]
  for = "/content/site.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
